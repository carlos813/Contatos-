<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16834a">
  <title>Drogaria Destaque | Salvar contato</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f3f6f4;
      font-family: Arial, Helvetica, sans-serif; color: #203027;
    }
    main {
      width: 100%; max-width: 420px; padding: 32px 24px;
      background: #fff; border-radius: 18px; text-align: center;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }
    .marca { color: #16834a; font-size: 27px; font-weight: 800; margin: 0 0 8px; }
    .local { color: #65736a; font-size: 14px; margin: 0 0 28px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { line-height: 1.5; color: #59665e; margin: 0 0 24px; }
    .botao {
      display: block; width: 100%; padding: 16px 20px; border-radius: 10px;
      background: #16834a; color: #fff; text-decoration: none;
      font-size: 16px; font-weight: 700;
    }
    .botao:focus, .botao:hover { background: #106b3b; }
    .nota { margin-top: 18px; font-size: 12px; color: #78847c; }
  </style>
</head>
<body>
  <main>
    <div class="marca">DROGARIA DESTAQUE</div>
    <div class="local">NILÓPOLIS • RJ</div>
    <h1>Salve nosso contato</h1>
    <p>Toque no botão abaixo para abrir o cartão de contato e adicioná-lo à agenda do seu celular.</p>

    <!-- O arquivo contato.vcf deve ficar na mesma pasta deste index.html. -->
    <a class="botao" href="./contato.vcf" type="text/vcard" download="Drogaria-Destaque.vcf">
      SALVAR CONTATO
    </a>

    <div class="nota">Após abrir o contato, confirme a opção “Adicionar” ou “Criar novo contato” no celular.</div>
  </main>
</body>
</html>
